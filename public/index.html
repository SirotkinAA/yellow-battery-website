<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Yellow Battery — сайт в разработке</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 28px; background: #f7d926; color: #191919; font-family: Arial, sans-serif; }
    main { width: min(100%, 960px); padding: clamp(28px, 7vw, 88px) 0; }
    .brand { margin: 0 0 72px; font-size: 18px; font-weight: 800; letter-spacing: .12em; }
    h1 { margin: 0 0 28px; font-size: clamp(44px, 9vw, 100px); line-height: 1; letter-spacing: -.055em; }
    .description { max-width: 520px; font-size: 20px; line-height: 1.6; }
    footer { margin-top: 80px; padding-top: 24px; border-top: 1px solid #191919; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">YELLOW BATTERY</p>
    <h1>Скоро здесь<br>будет наш сайт.</h1>
    <p class="description">Мы готовим сайт Yellow Battery. Загляните к нам позже.</p>
    <footer>yellow-battery.com</footer>
  </main>
</body>
</html>
