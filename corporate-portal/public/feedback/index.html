<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Замечания к сайту · Корппортал</title>
<link rel="stylesheet" href="/feedback/style.css">
<script src="/feedback/app.js" defer></script>
</head>
<body>
<main>
<nav><a href="/">Корппортал</a></nav>
<h1>Замечания к сайту</h1>
<p id="status" role="status"></p>
<a id="login" href="/auth/?return=feedback" hidden>Войти в корппортал</a>
<form id="draft" hidden>
 <p>Страница: <a id="source"></a></p>
 <label>Фрагмент<textarea name="excerpt" maxlength="1200" rows="3" required></textarea></label>
 <label>Комментарий<textarea name="comment" maxlength="2000" rows="4" required></textarea></label>
 <button type="submit">Отправить замечание</button>
</form>
<section id="journal" hidden><h2>Последние замечания</h2><div id="items"></div></section>
</main>
</body>
</html>
