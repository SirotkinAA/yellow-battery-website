const mailApp={folder:'inbox',selected:null,checked:new Set(),query:'',unread:false,flagged:false,attachments:false,vip:false,sort:'new',scope:'folder',screen:'list',undo:null,editing:null,folders:[{id:'inbox',name:'Входящие',icon:'▣'},{id:'sent',name:'Отправленные',icon:'↗'},{id:'drafts',name:'Черновики',icon:'▤'},{id:'outbox',name:'Исходящие',icon:'◷'},{id:'later',name:'Отправить позже',icon:'◷'},{id:'archive',name:'Архив',icon:'▥'},{id:'junk',name:'Спам',icon:'⊘'},{id:'trash',name:'Корзина',icon:'▱'},{id:'project',name:'Проекты ИБП',icon:'▰',custom:true}],items:[]};
const mailColors={red:'Красный',orange:'Оранжевый',yellow:'Жёлтый',green:'Зелёный',blue:'Синий',purple:'Фиолетовый',gray:'Серый'};
const mailSeed=[
['Алексей Волков','procurement@example.com','ИБП для серверной · исходные требования','Добрый день, Анна!\n\nПланируем обновление системы бесперебойного питания в серверной. Рассматриваем ИБП 200 кВА с автономией 20 минут.\n\nПросьба проверить конфигурацию и требования к помещению. Какие сведения нужны для расчёта?\n\nС уважением,\nАлексей Волков','2026-10-07T10:42:00+03:00','inbox',false,'red',true,['Требования к ИБП.txt']],
['Руководитель ТКО','engineer@example.com','Материалы приняты в работу','Анна, исходные требования приняты. Инженер проверит конфигурацию и подготовит список уточнений.','2026-10-07T09:15:00+03:00','inbox',false,'',true,[]],

['Команда портала','team@example.com','Добро пожаловать в пилот','Это демонстрационная почта. Все письма вымышленные. Изменения сохраняются только до перезагрузки страницы.','2026-10-06T08:30:00+03:00','inbox',true,'',false,[]],
['Анна Смирнова','demo@example.com','Re: ИБП для серверной · исходные требования','Алексей, добрый день! Спасибо за запрос. Передали требования в инженерный отдел.','2026-10-06T17:10:00+03:00','sent',true,'',true,[]],

function mailDate(d){return new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'}).format(new Date(d));}
function mailFolderName(){return mailApp.folders.find(f=>f.id===mailApp.folder)?.name||({all:'Все письма',unread:'Непрочитанные',flagged:'С флажками',vip:'VIP'})[mailApp.folder]||'Письма';}
function mailRows(){return mailApp.items.filter(m=>{
let base=mailApp.folder==='all'?true:mailApp.folder==='unread'?!m.read&&!['trash','junk'].includes(m.folder):mailApp.folder==='flagged'?!!m.flag&&!['trash','junk'].includes(m.folder):mailApp.folder==='vip'?m.vip&&!['trash','junk'].includes(m.folder):m.folder===mailApp.folder;
if(mailApp.scope==='all'&&mailApp.query)base=true;

}).sort((a,b)=>mailApp.sort==='sender'?a.from.localeCompare(b.from,'ru'):mailApp.sort==='subject'?a.subject.localeCompare(b.subject,'ru'):(new Date(a.date)-new Date(b.date))*(mailApp.sort==='old'?1:-1));}

function mailTargets(){return mailApp.items.filter(m=>mailApp.checked.size?mailApp.checked.has(m.id):m.id===mailApp.selected);}

ected':''}>По теме</option></select></div><div class="mail-filters">${[['unread','Непрочитанные'],['flagged','Флажки'],['attachments','Вложения'],['vip','VIP']].map(([key,label])=>`<button data-mf="${key}" aria-pressed="${mailApp[key]}" class="${mailApp[key]?'on':''}">${label}</button>`).join('')}</div><div class="mail-list-summary"><label><input type="checkbox" id="mxAll" ${rows.length&&rows.every(x=>mailApp.checked.has(x.id))?'checked':''}> Выбрать все</label><span>${rows.length} писем</span></div>${mailApp.checked.size?'<button class="mobile-only" style="margin-top:10px" data-ma="showActions">Действия с выбранными</button>':''}</div><div class="mx-list">${rows.length?rows.map(x=>`<div class="mx-row ${x.read?'':'unread'} ${m?.id===x.id?'selected':''}"><input type="checkbox" data-mcheck="${x.id}" aria-label="Выбрать письмо: ${esc(x.subject)}" ${mailApp.checked.has(x.id)?'checked':''}><button class="mx-open" data-mopen="${x.id}"><span class="mx-sender">${!x.read?'<span class="unread-dot" aria-label="Не прочитано"></span>':''}${esc(x.from)} ${x.vip?'★':''}<span class="flag-${x.flag}">${x.flag?'⚑':''}</span></span><time datetime="${x.date}">${mailDate(x.date)}</time><span class="mx-subject">${esc(x.subject)}</span><span class="mx-preview">${esc(x.text.slice(0,80))}</span>${x.files.length?'<span class="small">Вложений: '+x.files.length+'</span>':''}</button></div>`).join(''):'<div class="empty"><h3>Писем нет</h3><p>В этой папке нет писем, соответствующих поиску и фильтрам.</p><button data-ma="clearFilters">Сбросить фильтры</button></div>'}</div></section><section class="mail-reader"><div class="mail-tools"><button class="mobile-only" data-ma="showList">К списку</button><span class="small">${mailApp.checked.size?'Выбрано: '+mailApp.checked.size:m?'Письмо':'Выберите письмо'}</span><button data-ma="read" ${!mailTargets().length?'disabled':''}>Прочитано</button><button data-ma="unread" ${!mailTargets().length?'disabled':''}>Не прочитано</button><select id="mxFlag" aria-label="Установить флажок" ${!mailTargets().length?'disabled':''}><option value="">Флажок…</option>${Object.entries(mailColors).map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}<option value="none">Снять флажок</option></select><select id="mxMove" aria-label="Переместить в папку" ${!mailTargets().length?'disabled':''}><option value="">Переместить…</option>${mailOptions()}</select><button data-ma="archive" ${!mailTargets().length?'disabled':''}>Архив</button><button data-ma="junk" ${!mailTargets().length?'disabled':''}>Спам</button><button data-ma="trash" ${!mailTargets().length?'disabled':''}>В корзину</button>${mailApp.undo?'<button data-ma="undo">Отменить действие</button>':''}</div>${m?`<div class="mx-letter"><div class="small">${esc(mailApp.folders.find(f=>f.id===m.folder)?.name||'')} ${m.flag?'· <span class="flag-'+m.flag+'">⚑ '+mailColors[m.flag]+'</span>':''}</div><h2>${esc(m.subject)}</h2><div class="mail-envelope"><b>${esc(m.from)}</b><span>${esc(m.email)}</span><span>Кому: ${esc(m.to)}</span>${m.cc?'<span>Копия: '+esc(m.cc)+'</span>':''}<time datetime="${m.date}">${m.folder==='drafts'?'Изменён':m.folder==='later'?'Запланировано':'Отправлено'}: <b>${mailDate(m.date)} МСК (UTC+3)</b></time></div><button data-ma="vip">${m.vip?'Убрать из VIP':'Добавить отправителя в VIP'}</button>${m.folder==='drafts'||m.folder==='later'?'<button data-ma="editDraft">Редактировать</button>':''}<article>${esc(m.text).replace(/\n/g,'<br>')}</article>${m.files.length?`<div class="mail-attachments"><b>Вложения · демофайлы</b>${m.files.map((f,i)=>`<button data-mfile="${i}">${esc(f)} · скачать пример</button>`).join('')}</div>`:''}${m.related?'<div class="crm"><span class="small">Связано с CRM</span><h3>Демо: Северный центр · серверная</h3>'+goButton('deal','Открыть сделку')+'</div>':''}<div class="actions"><button data-ma="reply">Ответить</button><button data-ma="replyAll">Ответить всем</button><button data-ma="forward">Переслать</button></div>${mailApp.items.filter(x=>x.thread===m.thread&&x.id!==m.id).length?`<details class="mail-thread"><summary>Другие письма переписки</summary>${mailApp.items.filter(x=>x.thread===m.thread&&x.id!==m.id).map(x=>`<button data-mthread="${x.id}">${esc(x.from)} · ${mailDate(x.date)}<br>${esc(x.subject)}</button>`).join('')}</details>`:''}</div>`:'<div class="empty mail-no-selection"><h2>Выберите письмо</h2><p>Дата, получатели и переписка появятся здесь.</p></div>'}</section></div>`;}
function mailWire(root=document){root.querySelectorAll('[data-ma],[data-mfolder],[data-mf],[data-mopen],[data-mthread],[data-mcheck],[data-mfile]').forEach(el=>{el.onclick=mailHandleClick});}
function mailBind(){mailWire();const q=$('#mxSearch');if(!q)return;q.oninput=()=>{let pos=q.selectionStart;mailApp.query=q.value;mailRefresh();$('#mxSearch').focus();$('#mxSearch').setSelectionRange(pos,pos)};$('#mxScope').onchange=e=>{mailApp.scope=e.target.value;mailRefresh()};$('#mxSort').onchange=e=>{mailApp.sort=e.target.value;mailRefresh()};$('#mxAll').onchange=e=>{for(const x of mailRows())e.target.checked?mailApp.checked.add(x.id):mailApp.checked.delete(x.id);mailRefresh()};$('#mxMove').onchange=e=>mailMove(e.target.value);$('#mxFlag').onchange=e=>{if(!e.target.value)return;mailSnapshot();for(const m of mailTargets())m.flag=e.target.value==='none'?'':e.target.value;mailRefresh()};}
function mailMove(folder){if(!folder)return;mailSnapshot();for(const m of mailTargets()){m.previous=m.folder;m.folder=folder;}mailApp.checked.clear();mailApp.selected=null;mailRefresh();notify('Письма перемещены в демо');}
function mailModal(html){$('#mailModal')?.remove();const d=document.createElement('dialog');d.id='mailModal';d.innerHTML=html;document.body.append(d);mailWire(d);d.showModal();return d;}
function mailNewFolder(rename=false){const current=mailApp.folders.find(f=>f.id===mailApp.folder);const d=mailModal(`<form id="folderForm"><h2>${rename?'Переименовать папку':'Новая личная папка'}</h2><label for="folderName">Название</label><input id="folderName" required maxlength="60" value="${rename?esc(current.name):''}"><p class="small">Папка создаётся в демонстрационном ящике.</p><div class="actions"><button type="submit" class="primary">Сохранить</button><button type="button" data-ma="closeModal">Отмена</button></div></form>`);$('#folderForm').onsubmit=e=>{e.preventDefault();const name=$('#folderName').value.trim();if(!name)return;if(mailApp.folders.some(f=>f.name.toLowerCase()===name.toLowerCase()&&(!rename||f.id!==current.id))){notify('Папка с таким названием уже есть');return}if(rename)current.name=name;else{const id='folder-'+Date.now();mailApp.folders.push({id,name,icon:'▰',custom:true});mailApp.folder=id;}mailApp.selected=null;mailApp.checked.clear();d.close();mailRefresh()};}
function mailCompose(mode='new'){const m=mailApp.items.find(x=>x.id===mailApp.selected);const edit=mode==='edit';mailApp.editing=edit?m.id:null;const reply=mode==='reply'||mode==='replyAll';const to=edit?m.to:reply?m.email:'';const subject=edit?m.subject:reply?'Re: '+m.subject.replace(/^Re:\s*/i,''):mode==='forward'?'Fwd: '+m.subject:'';const text=edit?m.text:(reply||mode==='forward')?'\n\n'+mailDate(m.date)+' · '+m.from+'\n'+m.text.split('\n').map(s=>'> '+s).join('\n'):'';

const save=(folder)=>{const values={to:$('#mxTo').value.trim(),cc:$('#mxCc').value.trim(),bcc:$('#mxBcc').value.trim(),subject:$('#mxSubject').value.trim()||'(Без темы)',text:$('#mxBody').value};if(folder!=='drafts'&&(!values.to||![values.to,values.cc,values.bcc].filter(Boolean).flatMap(x=>x.split(',')).every(x=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x.trim())))){notify('Укажите корректные адреса получателей через запятую');return false}let date=new Date().toISOString();if(folder==='later'){const v=$('#mxSendAt').value;if(!v||new Date(v+':00+03:00')<=new Date()){notify('Выберите будущие дату и время');return false}date=new Date(v+':00+03:00').toISOString();}

function mailHandleClick(e){
const b=e.target.closest('[data-ma],[data-mfolder],[data-mf],[data-mopen],[data-mthread],[data-mcheck],[data-mfile]');if(!b)return;e.stopImmediatePropagation();
if(b.dataset.mcheck){b.checked?mailApp.checked.add(b.dataset.mcheck):mailApp.checked.delete(b.dataset.mcheck);mailRefresh();return;}

const id=b.dataset.mopen||b.dataset.mthread;if(id){const m=mailApp.items.find(x=>x.id===id);if(b.dataset.mthread){mailApp.folder=m.folder;mailApp.query='';mailApp.unread=false;mailApp.flagged=false;mailApp.attachments=false;mailApp.vip=false;}mailApp.selected=id;mailApp.checked.clear();mailApp.screen='detail';m.read=true;
// An unread view must not immediately hide the message the user just opened.
if(mailApp.folder==='unread')mailApp.folder=m.folder;if(mailApp.unread)mailApp.unread=false;mailRefresh();return;}
if(b.dataset.mfile!==undefined){const m=mailApp.items.find(x=>x.id===mailApp.selected);const filename=m.files[Number(b.dataset.mfile)];const url=URL.createObjectURL(new Blob(['ДЕМОНСТРАЦИОННЫЙ ФАЙЛ\n'+filename+'\nСодержимое для проверки загрузки. Не документ клиента.'],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);return;}
const m=mailApp.items.find(x=>x.id===mailApp.selected);switch(b.dataset.ma){
case'compose':mailCompose();break;case'reply':case'replyAll':case'forward':mailCompose(b.dataset.ma);break;case'editDraft':mailCompose('edit');break;
case'newFolder':mailNewFolder();break;case'renameFolder':mailNewFolder(true);break;
case'deleteFolder':{const f=mailApp.folders.find(f=>f.id===mailApp.folder&&f.custom);if(!f)break;mailModal(`<h2>Удалить папку «${esc(f.name)}»?</h2><p>Письма будут перенесены в «Архив» и останутся доступны.</p><div class="actions"><button data-ma="confirmDeleteFolder">Удалить папку</button><button data-ma="closeModal">Отмена</button></div>`);break;}
case'confirmDeleteFolder':for(const x of mailApp.items)if(x.folder===mailApp.folder)x.folder='archive';mailApp.folders=mailApp.folders.filter(f=>f.id!==mailApp.folder);mailApp.folder='archive';mailApp.selected=null;mailApp.checked.clear();$('#mailModal').close();mailRefresh();break;
case'closeModal':$('#mailModal').close();break;case'closeEditor':mailApp.saveEditor('drafts');$('#mailModal').close();mailRefresh();notify('Черновик сохранён');break;
case'sendDemo':case'scheduleDemo':if(mailApp.saveEditor(b.dataset.ma==='sendDemo'?'sent':'later')){$('#mailModal').close();mailRefresh();notify(b.dataset.ma==='sendDemo'?'Письмо перемещено в «Отправленные» только в демо. Доступна отмена.':'Сохранено в «Отправить позже». Автоматической отправки в демо нет.');}break;
case'read':case'unread':mailSnapshot();for(const x of mailTargets())x.read=b.dataset.ma==='read';mailRefresh();break;
case'archive':case'junk':case'trash':mailMove(b.dataset.ma);break;
case'undo':if(mailApp.undo){mailApp.items=mailApp.undo;mailApp.undo=null;mailApp.checked.clear();mailApp.selected=null;mailRefresh();notify('Последнее действие отменено');}break;
case'vip':if(m){const v=!m.vip;for(const x of mailApp.items)if(x.email===m.email)x.vip=v;mailRefresh()}break;
case'clearFilters':mailApp.query='';mailApp.unread=false;mailApp.flagged=false;mailApp.attachments=false;mailApp.vip=false;mailRefresh();break;
case'showActions':mailApp.screen='detail';mailRefresh();break;case'showFolders':mailApp.screen='folders';mailRefresh();break;case'showList':mailApp.screen='list';mailRefresh();break;
case'features':mailModal('<h2>Почтовое рабочее место</h2><p>В демо доступны папки, поиск, фильтры, флажки, прочтение, групповые действия, цепочки, ответы и черновики. Дата и время показываются в часовом поясе Москвы.</p><p>Синхронизация ящиков и папок, доставка писем, серверные правила, антиспам, отложенная отправка, напоминания и уведомления потребуют подключения почтовой системы. Смарт-папки с произвольными условиями, импорт/экспорт, форматирование и разметка вложений остаются в плане полного клиента.</p><p>Точное соответствие сборке Mail 16.0 (3901.100.1.1.11) пока не проверено. Это рабочий прототип, а не полный аналог Apple Mail.</p><button data-ma="closeModal">Закрыть</button>');break;
}
}

function catalogRender(){const c=catalogState,rows=catRows();return head('Товары','Каталог оборудования · подбор для продаж и пресейла',`<button data-cat="compare" ${c.compare.size<2?'disabled':''}>Сравнить (${c.compare.size})</button><button data-cat="draft">Подбор (${c.draft.size})</button>`)+`<div class="cat-status"><span class="tag">${c.mode==='demo'?'Демонстрационные товары':'Единая облачная база каталога'}</span><span>${c.mode==='demo'?'Вымышленные модели и цены. Подбор хранится до перезагрузки.':'Общая D1 · технический каталог на чтение. Цены и остатки не загружены.'}</span><button data-cat="connect">Обновить каталог</button><a href="/catalogue/connection/" target="_blank" rel="noopener noreferrer">Управление базой ↗</a></div>${c.error?`<p role="alert" class="cat-error">${esc(c.error)}</p>`:''}${c.busy?'<p role="status">Загружаем данные…</p>':''}<div class="cat-layout"><section class="card cat-filters"><h2>Каталог</h2><label>Категория<select id="catCategory"><option value="">Все категории</option>${c.categories.map(x=>`<option value="${esc(x.id)}" ${c.category===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>Бренд<select id="catBrand"><option value="">Все бренды на странице</option>${[...new Set(c.items.map(p=>p.brand))].filter(Boolean).map(b=>`<option ${c.brand===b?'selected':''}>${esc(b)}</option>`).join('')}</select></label><label>Тип позиции<select id="catKind"><option value="">Все позиции</option>${[['ordinary','Оборудование'],['composite','Сборные решения'],['component','Компоненты']].map(([v,n])=>`<option value="${v}" ${c.kind===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="cat-check"><input id="catStock" type="checkbox" ${c.stock?'checked':''}> В наличии</label><label class="cat-check"><input id="catPriced" type="checkbox" ${c.priceOnly?'checked':''}> С указанной ценой</label><button data-cat="reset">Сбросить фильтры</button><p class="small">Наличие — признак каталога, без складских остатков и резервов 1С.</p></section><section><div class="cat-toolbar"><input id="catQuery" aria-label="Поиск товаров" placeholder="Модель, артикул, другое название" value="${esc(c.query)}"><span class="small">${rows.length} позиций${c.mode==='live'?' на загруженной странице':''}</span></div>${c.mode==='live'?`<p class="small">В базе по выбранной категории: ${esc(c.total)}. Поиск и дополнительные фильтры действуют на текущую страницу из 100 товаров. Полный поисковый индекс — следующий этап.</p>`:''}<div class="cat-grid">${rows.map(p=>`<article class="card cat-product"><div class="cat-product-top"><span class="cat-symbol" aria-hidden="true">${p.categoryId==='battery'?'▥':p.composite?'▦':'▤'}</span><label class="cat-check"><input type="checkbox" data-cat-compare="${esc(p.id)}" aria-label="Сравнить ${esc(p.name)}" ${c.compare.has(p.id)?'checked':''}> Сравнить</label></div><span class="small">${esc(catName(p.categoryId))} · ${esc(p.brand)}</span><h2><button class="cat-title" data-cat-open="${esc(p.id)}">${esc(p.name)}</button></h2><p class="small">Артикул: ${esc(p.sku||'—')}</p><div class="cat-labels"><span class="tag">${p.inStock?'В наличии':'Уточнить наличие'}</span>${p.composite?'<span class="tag">Сборное решение</span>':''}${p.component?'<span class="tag">Компонент</span>':''}${p.archived?'<span class="tag">Архив</span>':''}</div><p class="cat-price">${esc(catMoney(p))}</p><div class="actions"><button data-cat-open="${esc(p.id)}">Карточка</button><button class="primary" data-cat-add="${esc(p.id)}">В подбор</button></div></article>`).join('')||'<div class="card"><h2>Товары не найдены</h2><p>Попробуйте изменить фильтры.</p></div>'}</div>${c.mode==='live'?`<div class="cat-paging"><button data-cat="prev" ${c.page<=1||c.busy?'disabled':''}>Назад</button><span>Страница ${c.page} из ${Math.max(1,c.pages)}</span><button data-cat="next" ${c.page>=c.pages||c.busy?'disabled':''}>Далее</button></div>`:''}</section></div>`;}
function catRefresh(){if(state.page==='catalog')render();}
async function catApi(path){const r=await fetch('/api/catalog/'+path,{headers:{Accept:'application/json'},cache:'no-store'});if(!(r.headers.get('content-type')||'').includes('application/json'))throw Error('Серверный адаптер ещё не опубликован. Сейчас доступен демонстрационный каталог.');const d=await r.json();if(!r.ok)throw Error(r.status===401?'Для реальной базы требуется корпоративный вход через защищённый портал.':r.status===503?'Корпоративная авторизация общего каталога ещё не настроена.':r.status===404?'Товар отсутствует или деактивирован.':'Товарная база временно недоступна. Повторите попытку.');return d;}
async function catLoad(){const c=catalogState,gen=++c.generation;c.busy=true;c.error='';catRefresh();try{const data=await catApi('products?page='+c.page+(c.category?'&category='+encodeURIComponent(c.category):''));if(gen!==c.generation)return;c.items=data.items;c.pages=data.pages;c.total=data.total;c.asOf=data.asOf;}catch(e){if(gen===c.generation){c.items=[];c.error=e.message;}}finally{if(gen===c.generation){c.busy=false;catRefresh();}}}
async function catConnect(){const c=catalogState;c.busy=true;c.error='';catRefresh();try{const status=await catApi('status');if(!status.configured)throw Error('Общий каталог подготовлен. Вход сотрудников ещё не настроен.');const data=await catApi('categories');c.mode='live';c.categories=data.items;c.category='';c.query='';c.brand='';c.page=1;c.items=[];c.compare.clear();c.draft.clear();await catLoad();}catch(e){c.error=e.message;}finally{c.busy=false;catRefresh();}}
function catDialog(html){document.getElementById('catDialog')?.remove();const d=document.createElement('dialog');d.id='catDialog';d.innerHTML=`<div class="cat-dialog-head"><span class="small">${catalogState.mode==='demo'?'Демонстрационный каталог':'Актуальная товарная база'}</span><button data-cat="close" aria-label="Закрыть карточку">Закрыть</button></div>`+html;document.body.append(d);catBind(d);d.showModal();return d;}
async function catDetail(id){const c=catalogState,gen=c.generation;let p=c.items.find(p=>p.id===id)||catDemoProducts.find(p=>c.mode==='demo'&&p.id===id);if(c.mode==='live'){catDialog('<p role="status">Загрузка карточки…</p>');try{p=await catApi('products/'+encodeURIComponent(id));}catch(e){catDialog(`<p role="alert">${esc(e.message)}</p>`);return;}if(gen!==c.generation)return;}if(!p)return;c.selected=p;c.tab='attributes';catShowDetail();}
function catShowDetail(){const c=catalogState,p=c.selected;const tabs=[['attributes','Характеристики'],['components','Состав решения'],['modifications','Модификации']];let body='';if(c.tab==='attributes')body=p.attributeError?`<p role="alert">${esc(p.attributeError)}</p>`:`<dl class="cat-spec">${(p.attributes||[]).map(a=>`<dt>${esc(a.name)}</dt><dd>${esc(catValues(a))}</dd>`).join('')||'<dt>Характеристики не заполнены</dt>'}</dl>`;if(c.tab==='components')body=(p.components||[]).map(x=>`<div class="row"><button data-cat-open="${esc(x.id)}">${esc(x.name)}</button><b>${esc(x.quantity)} шт.</b></div>`).join('')||'<p>Составные позиции не указаны.</p>';if(c.tab==='modifications')body=[...new Set([p.parentId,...p.modifications])].filter(id=>id&&id!==p.id).map(id=>`<div class="row"><button data-cat-open="${esc(id)}">${esc(c.items.find(x=>x.id===id)?.name||id)}</button></div>`).join('')||'<p>Связанные модификации не указаны.</p>';catDialog(`<h1>${esc(p.name)}</h1><p class="muted">${esc(p.brand)} · ${esc(p.sku||'Без артикула')}</p><div class="cat-detail-price"><b>${esc(catMoney(p))}</b><button class="primary" data-cat-add="${esc(p.id)}">В подбор</button></div><p class="small">${p.inStock?'В наличии по данным каталога':'Наличие необходимо уточнить'}${c.mode==='demo'?' · демонстрационные данные':''}</p><div class="cat-tabs">${tabs.map(([id,n])=>`<button data-cat-tab="${id}" aria-pressed="${c.tab===id}">${n}</button>`).join('')}</div>${body}<p class="small">${c.mode==='live'?'Данные получены: '+esc(new Date(p.asOf).toLocaleString('ru-RU')):'Демонстрация структуры карточки. Документы и изображения реальной базы не скопированы.'}</p>${c.mode==='live'&&Number.isInteger(p.localId)?`<a target="_blank" rel="noopener noreferrer" href="/catalogue/connection//product/${p.localId}/edit">Редактирование, фотографии и документы в базе ↗</a>`:''}`);}
async function catCompare(){const c=catalogState;let items=[...c.compare.values()];catDialog('<p role="status">Готовим сравнение…</p>');try{if(c.mode==='live')items=await Promise.all(items.map(p=>catApi('products/'+encodeURIComponent(p.id))));const attrs=new Map();items.forEach(p=>(p.attributes||[]).forEach(a=>attrs.set(a.id,a.name)));catDialog(`<h1>Сравнение товаров</h1><div class="table"><table><thead><tr><th>Параметр</th>${items.map(p=>`<th>${esc(p.name)}</th>`).join('')}</tr></thead><tbody><tr><td>Цена</td>${items.map(p=>`<td>${esc(catMoney(p))}</td>`).join('')}</tr><tr><td>Наличие</td>${items.map(p=>`<td>${p.inStock?'В наличии':'Уточнить'}</td>`).join('')}</tr>${[...attrs].map(([id,n])=>`<tr><td>${esc(n)}</td>${items.map(p=>{const a=p.attributes?.find(x=>x.id===id);return `<td>${p.attributeError?'Не загружено':a?esc(catValues(a)):'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class="small">Сравнение характеристик не подтверждает инженерную совместимость.</p>`);}catch(e){catDialog(`<p role="alert">${esc(e.message)}</p>`);}}
function catDraft(){const c=catalogState,items=[...c.draft.values()],sum=items.reduce((s,x)=>s+(x.product.priceStatus==='priced'?x.product.price*x.quantity:0),0),unknown=items.some(x=>x.product.priceStatus!=='priced');catDialog(`<h1>Подбор оборудования</h1><p>Черновик спецификации · хранится до перезагрузки.</p>${items.map(x=>`<div class="cat-draft-row"><div><b>${esc(x.product.name)}</b><p class="small">${esc(catMoney(x.product))} за шт.</p></div><label>Количество<input type="number" min="1" max="9999" step="1" value="${x.quantity}" data-cat-qty="${esc(x.product.id)}"></label><button data-cat-remove="${esc(x.product.id)}">Убрать</button></div>`).join('')||'<p>Добавьте товары из каталога.</p>'}<h2>${unknown?'Сумма известных цен':'Итого'}: ${new Intl.NumberFormat('ru-RU').format(sum)} ₽</h2>${unknown?'<p class="cat-error">Есть позиции без определённой цены. Итоговая стоимость не рассчитана.</p>':''}<div class="actions"><button data-cat="download" ${items.length?'':'disabled'}>Скачать подбор JSON</button><button class="primary" data-cat="toDeal" ${items.length?'':'disabled'}>В демосделку №1042</button></div><p class="small">Передача в реальную CRM пока не подключена. Цены не являются согласованным коммерческим предложением.</p>`);}
function catBind(root=document){root.querySelectorAll('[data-cat-open]').forEach(b=>b.onclick=()=>catDetail(b.dataset.catOpen));root.querySelectorAll('[data-cat-tab]').forEach(b=>b.onclick=()=>{catalogState.tab=b.dataset.catTab;catShowDetail()});root.querySelectorAll('[data-cat-add]').forEach(b=>b.onclick=()=>{const c=catalogState,id=b.dataset.catAdd,p=c.items.find(p=>p.id===id)||(c.selected?.id===id?c.selected:null)||catDemoProducts.find(p=>c.mode==='demo'&&p.id===id);if(!p)return;const old=c.draft.get(id);c.draft.set(id,{product:structuredClone(p),quantity:(old?.quantity||0)+1});notify('Добавлено в подбор');catRefresh()});root.querySelectorAll('[data-cat-compare]').forEach(b=>b.onchange=()=>{const c=catalogState,id=b.dataset.catCompare;if(b.checked&&c.compare.size>=4){b.checked=false;notify('Можно сравнить до четырёх товаров');return;}b.checked?c.compare.set(id,c.items.find(p=>p.id===id)):c.compare.delete(id);catRefresh()});root.querySelectorAll('[data-cat-qty]').forEach(b=>b.onchange=()=>{const q=Number(b.value);if(!Number.isInteger(q)||q<1||q>9999){b.value=catalogState.draft.get(b.dataset.catQty).quantity;return;}catalogState.draft.get(b.dataset.catQty).quantity=q;catDraft()});root.querySelectorAll('[data-cat-remove]').forEach(b=>b.onclick=()=>{catalogState.draft.delete(b.dataset.catRemove);catRefresh();catDraft()});root.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>catAction(b.dataset.cat));const q=root.querySelector('#catQuery');if(q){q.oninput=()=>{const pos=q.selectionStart;catalogState.query=q.value;catRefresh();const el=document.getElementById('catQuery');el.focus();el.setSelectionRange(pos,pos)};root.querySelector('#catCategory').onchange=e=>{catalogState.category=e.target.value;catalogState.page=1;catalogState.brand='';catalogState.mode==='live'?catLoad():catRefresh()};for(const [id,key]of [['catBrand','brand'],['catKind','kind'],['catStock','stock'],['catPriced','priceOnly']])root.querySelector('#'+id).onchange=e=>{catalogState[key]=e.target.type==='checkbox'?e.target.checked:e.target.value;catRefresh()};}}
function catAction(action){const c=catalogState;switch(action){case'close':document.getElementById('catDialog')?.close();break;case'connect':catConnect();break;case'demo':c.generation++;Object.assign(c,{mode:'demo',categories:catDemoCategories,items:catDemoProducts,category:'',page:1,pages:1,total:5,error:'',busy:false,query:'',brand:'',kind:'',stock:false,priceOnly:false});c.draft.clear();c.compare.clear();catRefresh();break;case'reset':Object.assign(c,{query:'',brand:'',kind:'',stock:false,priceOnly:false});catRefresh();break;case'prev':case'next':c.page+=action==='next'?1:-1;catLoad();break;case'compare':catCompare();break;case'draft':catDraft();break;case'toDeal':state.catalogSelection={mode:c.mode,createdAt:new Date().toISOString(),items:structuredClone([...c.draft.values()])};document.getElementById('catDialog').close();navigate('deal');notify('Подбор добавлен в демосделку. В рабочей CRM изменений нет.');break;case'download':{const blob=new Blob([JSON.stringify({mode:c.mode,createdAt:new Date().toISOString(),items:[...c.draft.values()]},null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='sstmk-selection.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break;}}}
function catalogDealSelection(){const selection=state.catalogSelection;if(!selection)return '';return `<section class="card" style="margin-top:20px"><h2>Подбор оборудования</h2><p class="small">${selection.mode==='demo'?'Демонстрационные товары':'Снимок данных каталога'} · ${esc(new Date(selection.createdAt).toLocaleString('ru-RU'))}</p>${selection.items.map(x=>`<div class="row"><span>${esc(x.product.name)} · ${x.quantity} шт.</span><b>${esc(catMoney(x.product))} / шт.</b></div>`).join('')}<p class="small">Это подбор в демосделке, без записи в рабочую CRM.</p>${goButton('catalog','Вернуться в каталог')}</section>`;}

// Role switching is an explicit demonstration only. The live adapter remains read-only.
const catRoles={sales:'Продажи · просмотр',content:'Контент-менеджер',pricing:'Менеджер цен',admin:'Администратор каталога'};
catalogState.role='sales';catalogState.audit=[];
function catRights(){const demo=catalogState.mode==='demo',r=catalogState.role;return {content:demo&&['content','admin'].includes(r),pricing:demo&&['pricing','admin'].includes(r),status:demo&&r==='admin'};}
const catRenderOriginal=catalogRender;
catalogRender=function(){const c=catalogState;return catRenderOriginal()+`<section class="card" style="margin-top:20px"><h2>Управление каталогом</h2>${c.mode==='demo'?`<label>Проверка роли в демо <select id="catRole">${Object.entries(catRoles).map(([id,n])=>`<option value="${id}" ${c.role===id?'selected':''}>${n}</option>`).join('')}</select></label><p class="small">Переключатель показывает сценарии доступа, не назначает права сотрудникам.</p>`:'<p>Права сотрудника будут определяться сервером. Сейчас подключение работает на чтение.</p>'}<div class="actions"><button data-cat="admin">Администрирование</button><button data-cat="audit">Журнал правок (${c.audit.length})</button></div></section>`;};
const catDetailOriginal=catShowDetail;
catShowDetail=function(){catDetailOriginal();const rights=catRights(),d=document.getElementById('catDialog');if(rights.content||rights.pricing){const b=document.createElement('button');b.className='primary';b.textContent='Редактировать карточку';b.onclick=()=>catEdit(catalogState.selected);d.append(b);}};
function catAdmin(){const c=catalogState,r=catRights();catDialog(`<h1>Администрирование каталога</h1><p>${c.mode==='demo'?esc(catRoles[c.role]):'Подключение на чтение'}</p><p class="small">Контент: модель, артикул, бренд и характеристики. Цены: стоимость и статус цены. Администратор: все эти поля, наличие и архив. Изменения сохраняются только в текущей демонстрации.</p><div class="table"><table><thead><tr><th>Товар</th><th>Цена</th><th>Статус</th><th>Действие</th></tr></thead><tbody>${c.items.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(catMoney(p))}</td><td>${p.archived?'Архив':'Активен'}</td><td>${r.content||r.pricing?`<button data-cat-edit="${esc(p.id)}">Править</button>`:`<button data-cat-open="${esc(p.id)}">Просмотр</button>`}</td></tr>`).join('')}</tbody></table></div>`);}
function catEdit(p){const r=catRights();if(!p||(!r.content&&!r.pricing))return;catalogState.selected=p;catDialog(`<h1>Редактирование товара</h1><p class="small">${esc(catRoles[catalogState.role])} · изменения только в демо</p><form id="catEditForm">${r.content?`<label>Название<input name="name" required maxlength="200" value="${esc(p.name)}"></label><label>Артикул<input name="sku" maxlength="100" value="${esc(p.sku)}"></label><label>Бренд<input name="brand" maxlength="100" value="${esc(p.brand)}"></label><h2>Характеристики</h2>${(p.attributes||[]).map((a,i)=>`<label>${esc(a.name)} ${esc(a.unit)}<textarea name="attribute${i}" rows="2">${esc((a.values||[]).map(v=>v===true?'Да':v===false?'Нет':v??'').join('\n'))}</textarea></label>`).join('')}<p class="small">Несколько значений — каждое с новой строки. Справочник характеристик сохраняется.</p>`:`<h2>${esc(p.name)}</h2><p>Характеристики доступны этой роли только для просмотра.</p>`}${r.pricing?`<label>Статус цены<select name="priceStatus"><option value="priced" ${p.priceStatus==='priced'?'selected':''}>Цена указана</option><option value="on_request" ${p.priceStatus==='on_request'?'selected':''}>По запросу</option><option value="missing" ${p.priceStatus==='missing'?'selected':''}>Не заполнена</option></select></label><label>Цена в рублях<input name="price" type="number" min="1" step="1" value="${p.price??''}"></label><p class="small">В демо редактируется готовая рублёвая цена. Валютные расчёты рабочей базы этим не изменяются.</p>`:''}${r.status?`<label class="cat-check"><input name="inStock" type="checkbox" ${p.inStock?'checked':''}> В наличии</label><label class="cat-check"><input name="archived" type="checkbox" ${p.archived?'checked':''}> Архивный товар</label>`:''}<p id="catEditError" role="alert"></p><div class="actions"><button class="primary" type="submit">Сохранить в демо</button><button type="button" data-cat="cancelEdit">Отмена</button></div></form>`);document.getElementById('catEditForm').onsubmit=e=>{e.prevent function catSaveEdit(data){const c=catalogState,p=c.selected,r=catRights();if(!p||(!r.content&&!r.pricing))return;const next=structuredClone(p);try{if(r.content){next.name=String(data.get('name')||'').trim();if(!next.name)throw Error('Укажите название.');next.sku=String(data.get('sku')||'').trim();next.brand=String(data.get('brand')||'').trim();next.attributes=(p.attributes||[]).map((a,i)=>({...a,values:String(data.get('attribute'+i)||'').split('\n').map(v=>v.trim()).filter(Boolean).map(v=>{const sample=a.values?.find(x=>x!==null);if(typeof sample==='number'){const n=Number(v.replace(',','.'));if(!Number.isFinite(n))throw Error('Укажите число: '+a.name);return n;}if(typeof sample==='boolean'){if(!['да','нет'].includes(v.toLowerCase()))throw Error('Укажите «Да» или «Нет»: '+a.name);return v.toLowerCase()==='да';}return v;})}));}if(r.pricing){next.priceStatus=String(data.get('priceStatus'));if(!['priced','on_request','missing'].includes(next.priceStatus))throw Error('Выберите статус цены.');next.price=next.priceStatus==='priced'?Number(data.get('price')):null;if(next.priceStatus==='priced'&&(!Number.isSafeInteger(next.price)||next.price<=0))throw Error('Укажите положительную целую цену.');}if(r.status){next.inStock=data.has('inStock');next.archived=data.has('archived');}const changes=Object.keys(next).filter(k=>JSON.stringify(next[k])!==JSON.stringify(p[k])).map(k=>({field:k,before:p[k],after:next[k]}));if(changes.length){Object.assign(p,next);c.audit.unshift({time:new Date().toISOString(),role:catRoles[c.role],name:p.name,changes});if(c.compare.has(p.id))c.compare.set(p.id,p);}document.getElementById('catDialog').close();catRefresh();notify('Карточка сохранена в демо. Рабочая база не изменена.');}catch(e){document.getElementById('catEditError').textContent=e.message;}}
